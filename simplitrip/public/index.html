<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpliTrip - Budget Travel Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
        }
        .trip-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .progress-bar {
            transition: width 0.5s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>
    
    <!-- React Scripts -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCgnRNIkfU92dr6JdxrPlU5B2NcNPrVzSc",
            authDomain: "simplitrip.firebaseapp.com",
            projectId: "simplitrip",
            storageBucket: "simplitrip.appspot.com",
            messagingSenderId: "1075212835917",
            appId: "1:1075212835917:web:75bb356b917ec750dbd004"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        window.firebase = { auth, db };
    </script>
    
    <!-- Main App -->
    <script type="text/babel" data-type="module">
        import { useState, useEffect } from 'react';
        import { BrowserRouter as Router, Routes, Route, Link, useNavigate } from 'react-router-dom';
        import { onAuthStateChanged, signOut } from 'firebase/auth';
        
        // Components
        function App() {
            const [user, setUser] = useState(null);
            
            useEffect(() => {
                const unsubscribe = onAuthStateChanged(window.firebase.auth, (user) => {
                    setUser(user);
                });
                return () => unsubscribe();
            }, []);
            
            const handleLogout = async () => {
                try {
                    await signOut(window.firebase.auth);
                } catch (error) {
                    console.error("Logout error:", error);
                }
            };
            
            return (
                <Router>
                    <div className="min-h-screen flex flex-col">
                        <header className="gradient-bg text-white">
                            <nav className="container mx-auto px-4 py-4 flex justify-between items-center">
                                <Link to="/" className="flex items-center space-x-2">
                                    <i data-feather="compass" className="w-6 h-6"></i>
                                    <span className="text-xl font-bold">SimpliTrip</span>
                                </Link>
                                <div className="flex items-center space-x-4">
                                    {user ? (
                                        <>
                                            <Link to="/dashboard" className="hover:text-blue-200 transition">
                                                <i data-feather="home" className="w-5 h-5"></i>
                                            </Link>
                                            <button 
                                                onClick={handleLogout}
                                                className="flex items-center space-x-1 bg-white text-blue-600 px-3 py-1 rounded-full text-sm font-medium hover:bg-blue-100 transition"
                                            >
                                                <i data-feather="log-out" className="w-4 h-4"></i>
                                                <span>Logout</span>
                                            </button>
                                        </>
                                    ) : (
                                        <Link to="/login" className="flex items-center space-x-1 bg-white text-blue-600 px-3 py-1 rounded-full text-sm font-medium hover:bg-blue-100 transition">
                                            <i data-feather="log-in" className="w-4 h-4"></i>
                                            <span>Login</span>
                                        </Link>
                                    )}
                                </div>
                            </nav>
                        </header>
                        
                        <main className="flex-grow">
                            <Routes>
                                <Route path="/" element={<LandingPage />} />
                                <Route path="/login" element={<LoginPage />} />
                                <Route path="/dashboard" element={<DashboardPage user={user} />} />
                                <Route path="/trip/:id" element={<TripDetailPage />} />
                            </Routes>
                        </main>
                        
                        <footer className="bg-gray-800 text-white py-6">
                            <div className="container mx-auto px-4 text-center">
                                <p>© 2024 SimpliTrip - Budget Travel Planner for Indian Travelers</p>
                                <div className="flex justify-center space-x-4 mt-2">
                                    <a href="#" className="hover:text-blue-300">
                                        <i data-feather="facebook" className="w-5 h-5"></i>
                                    </a>
                                    <a href="#" className="hover:text-blue-300">
                                        <i data-feather="twitter" className="w-5 h-5"></i>
                                    </a>
                                    <a href="#" className="hover:text-blue-300">
                                        <i data-feather="instagram" className="w-5 h-5"></i>
                                    </a>
                                </div>
                            </div>
                        </footer>
                    </div>
                </Router>
            );
        }
        
        // Pages
        function LandingPage() {
            return (
                <div>
                    <section className="gradient-bg text-white py-20">
                        <div className="container mx-auto px-4 text-center">
                            <h1 className="text-4xl md:text-5xl font-bold mb-4">Plan Your Perfect Trip Within Budget</h1>
                            <p className="text-xl mb-8 max-w-2xl mx-auto">SimpliTrip helps Indian travelers create customized itineraries that fit their budget perfectly.</p>
                            <Link to="/login" className="inline-block bg-white text-blue-600 px-6 py-3 rounded-full font-medium hover:bg-blue-100 transition shadow-lg">
                                Get Started - It's Free
                            </Link>
                        </div>
                    </section>
                    
                    <section className="py-16 bg-white">
                        <div className="container mx-auto px-4">
                            <h2 className="text-3xl font-bold text-center mb-12">How It Works</h2>
                            <div className="grid md:grid-cols-3 gap-8">
                                <div className="text-center p-6 rounded-lg bg-gray-50">
                                    <div className="w-16 h-16 mx-auto mb-4 rounded-full gradient-bg flex items-center justify-center text-white">
                                        <i data-feather="dollar-sign" className="w-8 h-8"></i>
                                    </div>
                                    <h3 className="text-xl font-semibold mb-2">Set Your Budget</h3>
                                    <p>Enter your total trip budget and we'll help you allocate it across flights, hotels, food and activities.</p>
                                </div>
                                <div className="text-center p-6 rounded-lg bg-gray-50">
                                    <div className="w-16 h-16 mx-auto mb-4 rounded-full gradient-bg flex items-center justify-center text-white">
                                        <i data-feather="map" className="w-8 h-8"></i>
                                    </div>
                                    <h3 className="text-xl font-semibold mb-2">Choose Destination</h3>
                                    <p>Select from popular Indian destinations or let us suggest budget-friendly locations.</p>
                                </div>
                                <div className="text-center p-6 rounded-lg bg-gray-50">
                                    <div className="w-16 h-16 mx-auto mb-4 rounded-full gradient-bg flex items-center justify-center text-white">
                                        <i data-feather="calendar" className="w-8 h-8"></i>
                                    </div>
                                    <h3 className="text-xl font-semibold mb-2">Plan & Track</h3>
                                    <p>Get a complete itinerary and track your expenses to stay within budget.</p>
                                </div>
                            </div>
                        </div>
                    </section>
                    
                    <section className="py-16 bg-gray-50">
                        <div className="container mx-auto px-4">
                            <h2 className="text-3xl font-bold text-center mb-12">Popular Indian Destinations</h2>
                            <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                {[
                                    { name: "Goa", price: "₹15,000", days: "5D/4N" },
                                    { name: "Manali", price: "₹12,000", days: "4D/3N" },
                                    { name: "Kerala", price: "₹18,000", days: "6D/5N" },
                                    { name: "Rajasthan", price: "₹20,000", days: "7D/6N" }
                                ].map((dest, idx) => (
                                    <div key={idx} className="bg-white rounded-lg overflow-hidden shadow-md trip-card transition">
                                        <div className="h-40 bg-blue-100 flex items-center justify-center">
                                            <i data-feather="map-pin" className="w-12 h-12 text-blue-500"></i>
                                        </div>
                                        <div className="p-4">
                                            <h3 className="text-xl font-semibold">{dest.name}</h3>
                                            <div className="flex justify-between mt-2 text-gray-600">
                                                <span>From {dest.price}</span>
                                                <span>{dest.days}</span>
                                            </div>
                                            <button className="mt-4 w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600 transition">
                                                Plan Trip
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>
                </div>
            );
        }
        
        function LoginPage() {
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [isLogin, setIsLogin] = useState(true);
            const [error, setError] = useState("");
            const navigate = useNavigate();
            
            const { auth } = window.firebase;
            
            const handleSubmit = async (e) => {
                e.preventDefault();
                setError("");
                
                try {
                    if (isLogin) {
                        // Login logic
                        await signInWithEmailAndPassword(auth, email, password);
                    } else {
                        // Signup logic
                        await createUserWithEmailAndPassword(auth, email, password);
                    }
                    navigate("/dashboard");
                } catch (err) {
                    setError(err.message);
                }
            };
            
            return (
                <div className="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
                    <div className="max-w-md w-full space-y-8 bg-white p-8 rounded-lg shadow-md">
                        <div className="text-center">
                            <i data-feather="compass" className="w-12 h-12 mx-auto text-blue-500"></i>
                            <h2 className="mt-6 text-3xl font-extrabold text-gray-900">
                                {isLogin ? "Sign in to your account" : "Create an account"}
                            </h2>
                        </div>
                        
                        {error && (
                            <div className="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
                                <span className="block sm:inline">{error}</span>
                            </div>
                        )}
                        
                        <form className="mt-8 space-y-6" onSubmit={handleSubmit}>
                            <div className="rounded-md shadow-sm space-y-4">
                                <div>
                                    <label htmlFor="email" className="block text-sm font-medium text-gray-700">
                                        Email address
                                    </label>
                                    <input
                                        id="email"
                                        name="email"
                                        type="email"
                                        required
                                        className="mt-1 appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                    />
                                </div>
                                <div>
                                    <label htmlFor="password" className="block text-sm font-medium text-gray-700">
                                        Password
                                    </label>
                                    <input
                                        id="password"
                                        name="password"
                                        type="password"
                                        required
                                        className="mt-1 appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                    />
                                </div>
                            </div>
                            
                            <div>
                                <button
                                    type="submit"
                                    className="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white gradient-bg hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                                >
                                    {isLogin ? "Sign in" : "Sign up"}
                                </button>
                            </div>
                        </form>
                        
                        <div className="text-center">
                            <button
                                onClick={() => setIsLogin(!isLogin)}
                                className="text-blue-600 hover:text-blue-800 text-sm font-medium"
                            >
                                {isLogin ? "Need an account? Sign up" : "Already have an account? Sign in"}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }
        
        function DashboardPage({ user }) {
            const [trips, setTrips] = useState([]);
            const [loading, setLoading] = useState(true);
            const navigate = useNavigate();
            
            useEffect(() => {
                // Simulate loading trips from Firebase
                setTimeout(() => {
                    setTrips([
                        {
                            id: "1",
                            destination: "Goa",
                            budget: 20000,
                            spent: 17500,
                            date: "15-20 May 2024",
                            categories: [
                                { name: "Flights", amount: 8000, percentage: 40 },
                                { name: "Hotel", amount: 6000, percentage: 30 },
                                { name: "Food", amount: 4000, percentage: 20 },
                                { name: "Activities", amount: 2000, percentage: 10 }
                            ]
                        },
                        {
                            id: "2",
                            destination: "Manali",
                            budget: 15000,
                            spent: 12000,
                            date: "10-14 April 2024",
                            categories: [
                                { name: "Flights", amount: 6000, percentage: 40 },
                                { name: "Hotel", amount: 4500, percentage: 30 },
                                { name: "Food", amount: 3000, percentage: 20 },
                                { name: "Activities", amount: 1500, percentage: 10 }
                            ]
                        }
                    ]);
                    setLoading(false);
                }, 1000);
            }, []);
            
            return (
                <div className="container mx-auto px-4 py-8">
                    <div className="flex justify-between items-center mb-8">
                        <h1 className="text-2xl font-bold">Welcome, {user?.email || "User"}</h1>
                        <Link 
                            to="/dashboard/new" 
                            className="flex items-center space-x-1 bg-blue-500 text-white px-4 py-2 rounded-full hover:bg-blue-600 transition"
                        >
                            <i data-feather="plus" className="w-4 h-4"></i>
                            <span>New Trip</span>
                        </Link>
                    </div>
                    
                    <div className="grid md:grid-cols-3 gap-6 mb-8">
                        <div className="bg-white p-6 rounded-lg shadow">
                            <div className="flex items-center space-x-2 text-gray-600 mb-2">
                                <i data-feather="compass" className="w-5 h-5"></i>
                                <h3 className="font-medium">Total Trips</h3>
                            </div>
                            <p className="text-3xl font-bold">2</p>
                        </div>
                        <div className="bg-white p-6 rounded-lg shadow">
                            <div className="flex items-center space-x-2 text-gray-600 mb-2">
                                <i data-feather="dollar-sign" className="w-5 h-5"></i>
                                <h3 className="font-medium">Total Budget</h3>
                            </div>
                            <p className="text-3xl font-bold">₹35,000</p>
                        </div>
                        <div className="bg-white p-6 rounded-lg shadow">
                            <div className="flex items-center space-x-2 text-gray-600 mb-2">
                                <i data-feather="credit-card" className="w-5 h-5"></i>
                                <h3 className="font-medium">Total Spent</h3>
                            </div>
                            <p className="text-3xl font-bold">₹29,500</p>
                        </div>
                    </div>
                    
                    <h2 className="text-xl font-bold mb-4">Your Upcoming Trips</h2>
                    
                    {loading ? (
                        <div className="flex justify-center py-12">
                            <div className="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
                        </div>
                    ) : (
                        <div className="grid md:grid-cols-2 gap-6">
                            {trips.map((trip) => (
                                <div 
                                    key={trip.id} 
                                    className="bg-white rounded-lg overflow-hidden shadow-md trip-card transition cursor-pointer"
                                    onClick={() => navigate(`/trip/${trip.id}`)}
                                >
                                    <div className="p-6">
                                        <div className="flex justify-between items-start mb-4">
                                            <div>
                                                <h3 className="text-xl font-bold">{trip.destination}</h3>
                                                <p className="text-gray-600">{trip.date}</p>
                                            </div>
                                            <div className="text-right">
                                                <p className="text-sm text-gray-500">Budget</p>
                                                <p className="font-bold">₹{trip.budget.toLocaleString()}</p>
                                            </div>
                                        </div>
                                        
                                        <div className="mb-4">
                                            <div className="flex justify-between text-sm mb-1">
                                                <span>Spent: ₹{trip.spent.toLocaleString()}</span>
                                                <span>Saved: ₹{(trip.budget - trip.spent).toLocaleString()}</span>
                                            </div>
                                            <div className="w-full bg-gray-200 rounded-full h-2.5">
                                                <div 
                                                    className="bg-blue-600 h-2.5 rounded-full progress-bar" 
                                                    style={{ width: `${(trip.spent / trip.budget) * 100}%` }}
                                                ></div>
                                            </div>
                                        </div>
                                        
                                        <div className="grid grid-cols-4 gap-2 text-center">
                                            {trip.categories.map((cat, idx) => (
                                                <div key={idx} className="p-2 bg-gray-50 rounded">
                                                    <p className="text-xs text-gray-500">{cat.name}</p>
                                                    <p className="font-medium">₹{cat.amount.toLocaleString()}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }
        
        function TripDetailPage() {
            // This would fetch trip details based on ID from Firebase
            const trip = {
                id: "1",
                destination: "Goa",
                budget: 20000,
                spent: 17500,
                date: "15-20 May 2024",
                categories: [
                    { name: "Flights", amount: 8000, percentage: 40 },
                    { name: "Hotel", amount: 6000, percentage: 30 },
                    { name: "Food", amount: 4000, percentage: 20 },
                    { name: "Activities", amount: 2000, percentage: 10 }
                ],
                itinerary: [
                    { day: 1, date: "15 May", activities: ["Flight to Goa", "Check-in hotel", "Beach visit"] },
                    { day: 2, date: "16 May", activities: ["Water sports", "Local market visit"] },
                    { day: 3, date: "17 May", activities: ["Island tour", "Sunset cruise"] }
                ]
            };
            
            return (
                <div className="container mx-auto px-4 py-8">
                    <div className="flex items-center mb-8">
                        <Link to="/dashboard" className="mr-4 text-blue-500 hover:text-blue-700">
                            <i data-feather="arrow-left" className="w-5 h-5"></i>
                        </Link>
                        <h1 className="text-2xl font-bold">{trip.destination} Trip</h1>
                    </div>
                    
                    <div className="grid lg:grid-cols-3 gap-8 mb-8">
                        <div className="lg:col-span-2 bg-white p-6 rounded-lg shadow">
                            <div className="flex justify-between mb-6">
                                <div>
                                    <h2 className="text-xl font-bold mb-1">Budget Overview</h2>
                                    <p>{trip.date}</p>
                                </div>
                                <div className="text-right">
                                    <p className="text-sm text-gray-500">Total Budget</p>
                                    <p className="text-2xl font-bold">₹{trip.budget.toLocaleString()}</p>
                                </div>
                            </div>
                            
                            <div className="mb-6">
                                <div className="flex justify-between text-sm mb-1">
                                    <span>Spent: ₹{trip.spent.toLocaleString()}</span>
                                    <span>Saved: ₹{(trip.budget - trip.spent).toLocaleString()}</span>
                                </div>
                                <div className="w-full bg-gray-200 rounded-full h-3">
                                    <div 
                                        className="bg-blue-600 h-3 rounded-full progress-bar" 
                                        style={{ width: `${(trip.spent / trip.budget) * 100}%` }}
                                    ></div>
                                </div>
                            </div>
                            
                            <h3 className="text-lg font-semibold mb-4">Expense Breakdown</h3>
                            <div className="grid sm:grid-cols-2 gap-4">
                                {trip.categories.map((cat, idx) => (
                                    <div key={idx} className="bg-gray-50 p-4 rounded">
                                        <div className="flex justify-between mb-2">
                                            <span className="font-medium">{cat.name}</span>
                                            <span>₹{cat.amount.toLocaleString()}</span>
                                        </div>
                                        <div className="w-full bg-gray-200 rounded-full h-2">
                                            <div 
                                                className="bg-blue-400 h-2 rounded-full" 
                                                style={{ width: `${cat.percentage}%` }}
                                            ></div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                        
                        <div className="bg-white p-6 rounded-lg shadow">
                            <h2 className="text-xl font-bold mb-4">Daily Itinerary</h2>
                            <div className="space-y-4">
                                {trip.itinerary.map((day, idx) => (
                                    <div key={idx} className="border-l-2 border-blue-400 pl-4">
                                        <div className="font-semibold">Day {day.day} - {day.date}</div>
                                        <ul className="list-disc list-inside text-sm mt-1 space-y-1">
                                            {day.activities.map((activity, aIdx) => (
                                                <li key={aIdx}>{activity}</li>
                                            ))}
                                        </ul>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                    
                    <div className="bg-white p-6 rounded-lg shadow">
                        <h2 className="text-xl font-bold mb-4">Expense Tracking</h2>
                        <table className="w-full">
                            <thead>
                                <tr className="text-left border-b">
                                    <th className="pb-2">Category</th>
                                    <th className="pb-2">Budget</th>
                                    <th className="pb-2">Spent</th>
                                    <th className="pb-2">Remaining</th>
                                </tr>
                            </thead>
                            <tbody>
                                {trip.categories.map((cat, idx) => (
                                    <tr key={idx} className="border-b last:border-0">
                                        <td className="py-3">{cat.name}</td>
                                        <td>₹{(cat.amount).toLocaleString()}</td>
                                        <td>₹{(cat.amount * 0.9).toLocaleString()}</td>
                                        <td>₹{(cat.amount * 0.1).toLocaleString()}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }
        
        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    
    <script>
        feather.replace();
    </script>
</body>
</html>
